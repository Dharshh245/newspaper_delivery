name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build Step
      run: echo "Build successful"

    # 🔐 Login to Docker Hub
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 🐳 Build Docker Image
    - name: Build Docker Image
      run: docker build -t dharshini24/newspaper-app:latest .

    # 📦 Push Docker Image
    - name: Push Docker Image
      run: docker push dharshini24/newspaper-app:latest
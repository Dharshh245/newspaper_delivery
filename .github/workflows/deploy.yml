name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  # Manual trigger for the pipeline
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 🔐 Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🐳 Build and tag Docker Image with commit SHA and latest
    - name: Build and Tag Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/newspaper-app:latest \
                     -t ${{ secrets.DOCKER_USERNAME }}/newspaper-app:${{ github.sha }} .

    # 📦 Push Docker Image tags
    - name: Push Docker Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/newspaper-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/newspaper-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Navigate to project directory (update path based on your server)
          cd /path/to/your/project
          
          # Pull the latest image
          docker pull ${{ secrets.DOCKER_USERNAME }}/newspaper-app:latest
          
          # Recreate containers without downtime based on new image
          docker-compose up -d --no-deps --build app
          
          # Remove dangling/old images
          docker image prune -f